name: Weekday Industry News Pulse
run-name: Industry News Pulse ${{ inputs.request_id || github.run_id }}

on:
  # Timing belongs to the local launchd scheduler, not GitHub's best-effort cron.
  workflow_dispatch:
    inputs:
      request_id:
        description: "Local scheduler dispatch identity (optional for operator runs)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: daily-intel
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: C0B1TPFSZKJ
      SLACK_TEAM_ID: ${{ secrets.SLACK_TEAM_ID }}
      MAX_DAILY_COST_USD: "3.00"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify Pacific weekday run boundary
        id: eligibility
        run: python -m intel.schedule --scheduled-cron '${{ github.event.schedule }}'

      - name: Set pulse identity
        if: steps.eligibility.outputs.eligible == 'true'
        run: |
          echo "DATE=${{ steps.eligibility.outputs.report_date }}" >> "$GITHUB_ENV"
          echo "INTERVAL_START=${{ steps.eligibility.outputs.interval_start }}" >> "$GITHUB_ENV"
          echo "INTERVAL_END=${{ steps.eligibility.outputs.interval_end }}" >> "$GITHUB_ENV"

      - name: Reserve this date before any paid generation
        if: steps.eligibility.outputs.eligible == 'true'
        id: generation
        env:
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          python -m intel.publication_guard \
            --brief-date "${DATE}" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --request-id "${REQUEST_ID}"

      - name: Persist generation reservation
        if: steps.generation.outputs.generate == 'true'
        run: |
          git config user.name "asa-intel-bot"
          git config user.email "asa-intel-bot@users.noreply.github.com"
          git add "intel/${DATE}/generation-attempt.json"
          git commit -m "intel: reserve pulse generation ${DATE}"
          git push

      - name: Find most recent prior ledger
        if: steps.generation.outputs.generate == 'true'
        run: |
          PRIOR_LEDGER=""
          for i in $(seq 1 120); do
            CHECK_DATE=$(date -u -d "${i} days ago" +%F 2>/dev/null || date -u -v-${i}d +%F)
            CANDIDATE="intel/${CHECK_DATE}/ledger.json"
            if [ -f "$CANDIDATE" ]; then PRIOR_LEDGER="$CANDIDATE"; break; fi
          done
          echo "PRIOR_LEDGER=$PRIOR_LEDGER" >> "$GITHUB_ENV"

      - name: Collect raw signal
        if: steps.generation.outputs.generate == 'true'
        run: python -m intel.pipeline collect --out-dir intel/${DATE}

      - name: Stage 1 — classify every candidate
        if: steps.generation.outputs.generate == 'true'
        run: python -m intel.pipeline triage --in-file intel/${DATE}/raw.jsonl --out-file intel/${DATE}/triaged.jsonl

      - name: Stage 2 — synthesize uncapped material pulse
        if: steps.generation.outputs.generate == 'true'
        run: |
          ARGS=""
          if [ -n "${PRIOR_LEDGER}" ]; then ARGS="--prior-ledger ${PRIOR_LEDGER}"; fi
          python -m intel.pipeline synthesize \
            --in-file intel/${DATE}/triaged.jsonl \
            --out-file intel/${DATE}/brief.md \
            ${ARGS} \
            --event-registry intel/event_registry.json \
            --brief-date "${DATE}"

      - name: Update topic ledger
        if: steps.generation.outputs.generate == 'true'
        run: |
          ARGS=""
          if [ -n "${PRIOR_LEDGER}" ]; then ARGS="--prior-ledger ${PRIOR_LEDGER}"; fi
          python -m intel.update_ledger \
            --brief-file intel/${DATE}/brief.md \
            ${ARGS} \
            --ledger-out intel/${DATE}/ledger.json \
            --event-registry intel/event_registry.json

      - name: Create receipt-bound delivery package
        if: steps.generation.outputs.generate == 'true'
        run: |
          python -m intel.delivery create \
            --brief-file intel/${DATE}/brief.md \
            --package-file intel/${DATE}/delivery.json \
            --brief-date ${DATE} \
            --cadence weekday_daily \
            --interval-start "${INTERVAL_START}" \
            --interval-end "${INTERVAL_END}" \
            --workspace-id "${SLACK_TEAM_ID}" \
            --workflow-run-id "${GITHUB_RUN_ID}"

      - name: Commit canonical artifact and delivery package
        if: steps.generation.outputs.generate == 'true'
        run: |
          git config user.name "asa-intel-bot"
          git config user.email "asa-intel-bot@users.noreply.github.com"
          git add intel/${DATE}/ intel/event_registry.json
          git diff --cached --quiet || (git commit -m "intel: pulse ${DATE}" && git push)

      - name: Bind repository receipt
        if: steps.generation.outputs.generate == 'true'
        run: |
          python -m intel.delivery mark-repository \
            --package-file intel/${DATE}/delivery.json \
            --commit-sha "$(git rev-parse HEAD)"
          git add intel/${DATE}/delivery.json
          git diff --cached --quiet || (git commit -m "intel: repository receipt ${DATE}" && git push)

      - name: Deliver and read back Slack message
        if: steps.generation.outputs.generate == 'true'
        run: python -m intel.delivery resume-slack --package-file intel/${DATE}/delivery.json --channel "${SLACK_CHANNEL_ID}"

      - name: Commit Slack delivery receipt
        if: always() && steps.generation.outputs.generate == 'true'
        run: |
          git add intel/${DATE}/delivery.json
          git diff --cached --quiet || (git commit -m "intel: Slack delivery receipt ${DATE}" && git push)

      - name: Upload artifacts
        if: always() && steps.generation.outputs.generate == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: intel-${{ env.DATE }}
          path: intel/${{ env.DATE }}/
          retention-days: 30
